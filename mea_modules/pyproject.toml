[project]
name = "mea_modules"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "spikeinterface==0.103.2",
    "numpy",
    "h5py",
    "scipy",
    # diagnostics/ renders review-artifact plots; it is the only matplotlib user.
    "matplotlib",
    # reconstruction/ is the only importer. Pinned to 0.1.2 to match the version
    # validated in the axon_recon conda env (editable-installed from a dev
    # checkout of axon_velocity, which tracks upstream's 0.1.2 release exactly).
    # PyPI's project name is
    # "axon-velocity" (hyphenated) but the importable module is "axon_velocity"
    # (underscored) — confirmed via `pip index versions axon-velocity` (0.1.0,
    # 0.1.1, 0.1.2, 0.2.0 published) and `pip show axon_velocity`, both against
    # this env. 0.2.0 exists on PyPI but is UNTESTED here — do not float this
    # pin without re-validating `track_unit_axon` against it first, since a
    # signature or default-params change would silently swap the tuned
    # production params for whatever that release ships.
    "axon-velocity==0.1.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# This directory *is* the package: pyproject.toml sits inside mea_modules/, so
# the package root maps onto ".". Packages are listed explicitly rather than
# auto-discovered — discovery over "." would expose io/ as a bare top-level
# `io` package and shadow nothing good.
[tool.setuptools]
# Every importable subpackage on disk is listed explicitly (discovery is not
# used — see the layout note above).
packages = [
    "mea_modules",
    "mea_modules.io",
    "mea_modules.preprocessing",
    "mea_modules.quality",
    "mea_modules.concatenation",
    "mea_modules.comparison",
    "mea_modules.spikesorting",
    "mea_modules.diagnostics",
    "mea_modules.curation",
    "mea_modules.reconstruction",
    "mea_modules.registration",
    "mea_modules.postprocess",
    "mea_modules.templates",
]

[tool.setuptools.package-dir]
"mea_modules" = "."

# This package carries its own tests (mea_modules/tests). testpaths makes them
# discoverable when pytest is rooted at this package (e.g. run from here, or
# once mea_modules stands alone). Tests are not installed (not in packages above).
[tool.pytest.ini_options]
testpaths = ["tests"]
