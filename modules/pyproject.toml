[project]
name = "mea_modules"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "spikeinterface==0.103.2",
    "numpy",
    "h5py",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mea_modules*"]
